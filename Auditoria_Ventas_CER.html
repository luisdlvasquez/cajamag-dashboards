<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAJAMAG — Auditoría de Ventas</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --brand:#00685E; --brand-dark:#004d45; --brand-light:#e6f3f1;
    --bad:#d64545; --bad-bg:#fdecec;
    --ok:#1f9d55; --ok-bg:#e9f9ee;
    --warn:#b8860b; --warn-bg:#fff6e0;
    --ink:#1f2a30; --ink-soft:#5B6770; --ink-faint:#98a2ac;
    --line:#e7eaec; --bg:#f4f6f7; --card:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Montserrat',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

  /* ---------- gate ---------- */
  #gate-overlay{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 30% 20%,#00847a,#003732);display:flex;align-items:center;justify-content:center;}
  #gate-overlay .box{background:#fff;border-radius:18px;padding:38px 34px;width:340px;max-width:90vw;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center;}
  #gate-overlay .box .ic{font-size:32px;margin-bottom:8px;}
  #gate-overlay .box h2{font-size:17px;font-weight:800;color:var(--brand-dark);margin:0 0 6px;}
  #gate-overlay .box p{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;line-height:1.5;}
  #gate-pw{width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:12px;outline:none;transition:border-color .15s;}
  #gate-pw:focus{border-color:var(--brand);}
  #gate-err{display:none;color:var(--bad);font-size:11.5px;margin-bottom:10px;}
  #gate-btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s;}
  #gate-btn:hover{background:var(--brand-dark);}
  #gate-content{display:none;}

  /* ---------- header ---------- */
  header{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:18px 22px 22px;position:sticky;top:0;z-index:10;}
  .hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  header h1{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;white-space:nowrap;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#4CD964;display:inline-block;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  .hdr-sub{font-size:12px;opacity:.8;margin-top:4px;}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
  .stat{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;}
  .stat .n{font-size:22px;font-weight:800;line-height:1;}
  .stat .l{font-size:10.5px;opacity:.85;margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .stat.warn{background:rgba(255,255,255,.22);}

  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar input[type=text]{flex:1;min-width:180px;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:var(--card);outline:none;transition:border-color .15s;}
  .toolbar input[type=text]:focus{border-color:var(--brand);}
  .toolbar button.secondary{padding:10px 14px;border-radius:10px;background:var(--card);color:var(--brand);border:1.5px solid var(--line);font-weight:700;font-size:12.5px;cursor:pointer;transition:border-color .15s;}
  .toolbar button.secondary:hover{border-color:var(--brand);}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
  .tab{flex:1;border:none;background:transparent;padding:10px 8px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s;}
  .tab.active{background:var(--brand);color:#fff;}
  .tab .badge{background:rgba(0,0,0,.12);border-radius:999px;padding:1px 7px;font-size:11px;}
  .tab.active .badge{background:rgba(255,255,255,.25);}
  .tab.tab-dup .badge{background:var(--bad-bg);color:var(--bad);}
  .tab.tab-dup.active .badge{background:rgba(255,255,255,.25);color:#fff;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(16,24,28,.06);border:1px solid var(--line);overflow:hidden;margin-bottom:11px;transition:box-shadow .15s,opacity .2s;}
  .card:hover{box-shadow:0 4px 16px rgba(16,24,28,.08);}
  .card.dup{border-color:#f2c1c1;}
  .card-body{padding:15px 16px;}
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .avatar-row{display:flex;gap:11px;align-items:flex-start;flex:1;min-width:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-light);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .titulo{font-weight:800;font-size:14.5px;color:var(--ink);line-height:1.3;overflow-wrap:anywhere;}
  .meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .meta b{color:var(--ink);font-weight:700;}
  .monto{font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap;flex-shrink:0;}
  .dup-tag{display:inline-flex;align-items:center;gap:5px;background:var(--bad-bg);color:var(--bad);font-weight:800;font-size:10.5px;padding:4px 9px;border-radius:7px;margin-bottom:10px;}
  .row-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .deal-link{font-size:11.5px;font-weight:700;color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
  .deal-link:hover{text-decoration:underline;}
  .actions{display:flex;gap:8px;}
  .btn{padding:8px 14px;border-radius:8px;border:none;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s;}
  .btn-ok{background:var(--ok-bg);color:var(--ok);}
  .btn-ok:hover{background:var(--ok);color:#fff;}
  .btn-bad{background:var(--bad-bg);color:var(--bad);}
  .btn-bad:hover{background:var(--bad);color:#fff;}
  .skel-titulo{background:#e7eaec;}

  /* ---------- skeleton ---------- */
  .skeleton{background:linear-gradient(90deg,#eef0f2 25%,#e4e7ea 37%,#eef0f2 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .skel-card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:15px 16px;margin-bottom:11px;}
  .skel-line1{height:14px;width:55%;margin-bottom:8px;}
  .skel-line2{height:11px;width:35%;}

  /* ---------- empty state ---------- */
  .empty-state{padding:52px 24px 44px;text-align:center;}
  .empty-state .ic{font-size:38px;margin-bottom:12px;opacity:.9;}
  .empty-state h3{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 6px;}
  .empty-state p{font-size:12.5px;color:var(--ink-faint);margin:0;max-width:280px;margin-left:auto;margin-right:auto;line-height:1.5;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}

  @media (max-width:480px){
    .stats{grid-template-columns:repeat(3,1fr);}
    .stat .n{font-size:18px;}
    .row-top{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div id="gate-overlay">
  <div class="box">
    <div class="ic">🔒</div>
    <h2>Auditoría de Ventas — CAJAMAG</h2>
    <p>Acceso restringido. Ingresa la contraseña para continuar.</p>
    <input type="password" id="gate-pw" placeholder="Contraseña" autocomplete="off">
    <div id="gate-err">Contraseña incorrecta.</div>
    <button id="gate-btn">Entrar</button>
  </div>
</div>

<div id="gate-content">
<header>
  <div class="hdr-top">
    <h1>🕵️ Auditoría de Ventas</h1>
    <span class="live-pill"><span class="live-dot"></span><span id="lastUpdate">actualizando…</span></span>
  </div>
  <div class="hdr-sub">Aprueba o rechaza para que se reflejen (o no) en la franja "en vivo" de los tableros.</div>

  <div class="stats">
    <div class="stat"><div class="n" id="statPendientes">—</div><div class="l">Por auditar</div></div>
    <div class="stat warn"><div class="n" id="statDup">—</div><div class="l">Posibles duplicados</div></div>
    <div class="stat"><div class="n" id="statAprobadasHoy">—</div><div class="l">Aprobadas hoy</div></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input type="text" id="auditorName" placeholder="Tu nombre (para dejar registro de quién auditó)">
    <button class="secondary" id="btnRefresh">↻ Actualizar</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabAll" data-target="panelAll">📋 Por auditar <span class="badge" id="countAll">0</span></button>
    <button class="tab tab-dup" id="tabDup" data-target="panelDup">🚩 Duplicados <span class="badge" id="countDup">0</span></button>
  </div>

  <div class="panel active" id="panelAll">
    <div id="listAll">
      <div class="skel-card"><div class="skeleton skel-line1"></div><div class="skeleton skel-line2"></div></div>
      <div class="skel-card"><div class="skeleton skel-line1"></div><div class="skeleton skel-line2"></div></div>
    </div>
  </div>

  <div class="panel" id="panelDup">
    <div id="listDup">
      <div class="skel-card"><div class="skeleton skel-line1"></div><div class="skeleton skel-line2"></div></div>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var HASH = 453194326; // huella del password, no es el password en si
  function simpleHash(str){
    var h = 5381;
    for(var i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
    h = ((h ^ (h>>>15)) * 2246822519) >>> 0;
    h = ((h ^ (h>>>13)) * 3266489917) >>> 0;
    h = (h ^ (h>>>16)) >>> 0;
    return h % 999999999;
  }
  var sessionPassword = null;

  function tryUnlock(){
    var pw = document.getElementById('gate-pw').value;
    if(simpleHash(pw) === HASH){
      sessionPassword = pw;
      try{ sessionStorage.setItem('cer_auditoria_pw', pw); }catch(e){}
      document.getElementById('gate-overlay').style.display = 'none';
      document.getElementById('gate-content').style.display = '';
      initApp();
    } else {
      document.getElementById('gate-err').style.display = 'block';
    }
  }
  document.getElementById('gate-btn').addEventListener('click', tryUnlock);
  document.getElementById('gate-pw').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
  try{
    var saved = sessionStorage.getItem('cer_auditoria_pw');
    if(saved && simpleHash(saved) === HASH){
      sessionPassword = saved;
      document.getElementById('gate-overlay').style.display = 'none';
      document.getElementById('gate-content').style.display = '';
      initApp();
    }
  }catch(e){}

  // ---------------- App ----------------
  var SUPA_URL = 'https://nzmnzmnozbeqttofbmlf.supabase.co';
  var SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56bW56bW5vemJlcXR0b2ZibWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTAzMjQsImV4cCI6MjA5NTIyNjMyNH0.r3hrXsazoJK_xUWTsskEgjQ40Xhg60_0YaGvWs1VXP8';
  var AUDIT_FN = SUPA_URL + '/functions/v1/bitrix-audit';
  var ENRICH_FN = SUPA_URL + '/functions/v1/bitrix-enrich';
  // Bitrix bloquea las llamadas que vienen de servidores en la nube, asi que el
  // enriquecimiento (traer titulo/monto/cliente/asesor reales) se hace aqui, desde
  // el navegador de quien audita, que si tiene acceso a la red de Bitrix.
  var BITRIX_REST_URL = 'https://bitrix.cajamag.com.co/rest/24371/jptcd95wxx2lruif/';
  var refreshTimer = null;
  var clockTimer = null;
  var lastUpdateTs = null;
  var enriching = {}; // evita enriquecer la misma fila dos veces en paralelo

  function bitrixCall(method, params){
    var qs = new URLSearchParams(params || {}).toString();
    return fetch(BITRIX_REST_URL + method + '.json' + (qs ? '?' + qs : ''))
      .then(function(r){ return r.json(); })
      .then(function(d){ return d && d.result ? d.result : null; })
      .catch(function(){ return null; });
  }

  function enrichRow(r){
    if(enriching[r.id]) return Promise.resolve();
    if(!r.deal_id || !/^\d+$/.test(String(r.deal_id))) return Promise.resolve(); // filas de prueba, no son negocios reales
    if(r.titulo) return Promise.resolve(); // ya viene con datos (formato de prueba/legado)
    enriching[r.id] = true;

    return bitrixCall('crm.deal.get', { ID: r.deal_id }).then(function(deal){
      if(!deal) return;
      var monto = deal.OPPORTUNITY != null ? Number(deal.OPPORTUNITY) : null;
      var etapa = deal.STAGE_ID || null;
      var pipeline = deal.CATEGORY_ID || null;
      var companyId = (deal.COMPANY_ID && deal.COMPANY_ID !== '0') ? deal.COMPANY_ID : null;
      var contactId = (deal.CONTACT_ID && deal.CONTACT_ID !== '0') ? deal.CONTACT_ID : null;
      var asesorId = deal.ASSIGNED_BY_ID || null;
      var asesor = asesorId ? ('Asesor #' + asesorId) : null;

      var clienteP = companyId
        ? bitrixCall('crm.company.get', { ID: companyId }).then(function(c){ return c && c.TITLE ? c.TITLE : null; })
        : (contactId
            ? bitrixCall('crm.contact.get', { ID: contactId }).then(function(c){ return c ? [c.NAME, c.LAST_NAME].filter(Boolean).join(' ') : null; })
            : Promise.resolve(null));

      var asesorP = asesorId
        ? bitrixCall('user.get', { ID: asesorId }).then(function(u){
            var uu = Array.isArray(u) ? u[0] : u;
            if(!uu) return null;
            var nombre = [uu.NAME, uu.LAST_NAME].filter(Boolean).join(' ');
            return nombre || null;
          })
        : Promise.resolve(null);

      return Promise.all([clienteP, asesorP]).then(function(res){
        var clienteNombre = res[0];
        var asesorNombre = res[1];
        var dealTitleUsable = deal.TITLE && !/^\s*\(\d+\)\s*$/.test(deal.TITLE) ? deal.TITLE : null;
        var titulo = clienteNombre || dealTitleUsable || ('Negocio #' + r.deal_id);
        if(asesorNombre) asesor = asesorNombre;

        return fetch(ENRICH_FN, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            password: sessionPassword, id: r.id, titulo: titulo, monto: monto,
            etapa: etapa, pipeline: pipeline, asesor: asesor, asesor_id: asesorId,
            company_id: companyId, contact_id: contactId
          })
        });
      });
    }).catch(function(e){ console.error('enriquecimiento fallo', r.id, e); })
      .then(function(){ enriching[r.id] = false; });
  }

  function fmtMonto(n){ if(n==null) return '—'; return '$'+Math.round(n).toLocaleString('es-CO'); }
  function fmtFecha(iso){
    try{ var d=new Date(iso); return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return iso||''; }
  }
  function initials(name){
    if(!name) return '?';
    var parts = name.trim().split(/\s+/);
    var s = parts[0][0] + (parts.length>1 ? parts[parts.length-1][0] : '');
    return s.toUpperCase();
  }
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }
  function auditorName(){
    var el = document.getElementById('auditorName');
    var v = (el.value||'').trim();
    try{ if(v) sessionStorage.setItem('cer_auditor_nombre', v); }catch(e){}
    return v || null;
  }

  function cardHtml(r, isDup){
    var dealUrl = 'https://bitrix.cajamag.com.co/crm/deal/details/' + encodeURIComponent(r.deal_id) + '/';
    var nombre = r.titulo || ('Negocio #'+r.deal_id);
    return '<div class="card' + (isDup?' dup':'') + '" data-id="'+r.id+'">'
      + '<div class="card-body">'
      + (isDup ? '<div class="dup-tag">⚠ Posible duplicado de negocio #'+(r.duplicado_de_id||'?')+'</div>' : '')
      + '<div class="row-top">'
      + '<div class="avatar-row">'
      + '<div class="avatar">'+initials(nombre)+'</div>'
      + '<div><div class="titulo">'+nombre+'</div>'
      + '<div class="meta"><b>Asesor:</b> '+(r.asesor||'—')+' &nbsp;·&nbsp; '+fmtFecha(r.creado_en)+'</div></div>'
      + '</div>'
      + '<div class="monto">'+fmtMonto(r.monto)+'</div>'
      + '</div>'
      + '<div class="row-bottom">'
      + '<a class="deal-link" href="'+dealUrl+'" target="_blank" rel="noopener">Ver negocio #'+r.deal_id+' en Bitrix ↗</a>'
      + '<div class="actions">'
      + '<button class="btn btn-ok" data-accion="aprobado">✓ Aprobar</button>'
      + '<button class="btn btn-bad" data-accion="rechazado">✕ Rechazar</button>'
      + '</div>'
      + '</div>'
      + '</div></div>';
  }

  function emptyStateHtml(icon, title, sub){
    return '<div class="empty-state"><div class="ic">'+icon+'</div><h3>'+title+'</h3><p>'+sub+'</p></div>';
  }

  function render(rows){
    var dup = rows.filter(function(r){ return r.posible_duplicado; });
    var all = rows;

    document.getElementById('countDup').textContent = dup.length;
    document.getElementById('countAll').textContent = all.length;
    document.getElementById('statPendientes').textContent = all.length;
    document.getElementById('statDup').textContent = dup.length;

    var elDup = document.getElementById('listDup');
    var elAll = document.getElementById('listAll');

    elDup.innerHTML = dup.length
      ? dup.map(function(r){ return cardHtml(r, true); }).join('')
      : emptyStateHtml('✅', 'Sin duplicados', 'Ninguna venta pendiente parece repetida por ahora.');

    elAll.innerHTML = all.length
      ? all.map(function(r){ return cardHtml(r, false); }).join('')
      : emptyStateHtml('🎉', '¡Todo al día!', 'No hay ventas pendientes de auditoría. En cuanto se cierre una venta nueva en Bitrix, aparecerá aquí sola.');

    document.querySelectorAll('.btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var card = btn.closest('.card');
        var id = card.getAttribute('data-id');
        var accion = btn.getAttribute('data-accion');
        actuar(id, accion, card);
      });
    });

    lastUpdateTs = Date.now();
    updateClock();
  }

  function updateClock(){
    var el = document.getElementById('lastUpdate');
    if(!el || !lastUpdateTs){ return; }
    var secs = Math.round((Date.now() - lastUpdateTs) / 1000);
    if(secs < 5) el.textContent = 'actualizado ahora';
    else if(secs < 60) el.textContent = 'hace ' + secs + 's';
    else el.textContent = 'hace ' + Math.round(secs/60) + ' min';
  }

  function actuar(id, accion, cardEl){
    var nombre = auditorName();
    if(!nombre){
      showToast('Escribe tu nombre arriba antes de auditar.');
      return;
    }
    cardEl.style.opacity = '0.5';
    fetch(AUDIT_FN, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: id, accion: accion, password: sessionPassword, auditado_por: nombre })
    }).then(function(r){ return r.json(); }).then(function(resp){
      if(resp.error){
        showToast('Error: ' + resp.error);
        cardEl.style.opacity = '1';
        return;
      }
      showToast(accion === 'aprobado' ? 'Venta aprobada ✔' : 'Venta rechazada');
      cargar();
      cargarAprobadasHoy();
    }).catch(function(e){
      showToast('Error de conexión.');
      cardEl.style.opacity = '1';
    });
  }

  function cargarAprobadasHoy(){
    var hoy = new Date();
    var inicio = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).toISOString();
    fetch(SUPA_URL + '/rest/v1/bitrix_eventos?estado_auditoria=eq.aprobado&auditado_en=gte.' + encodeURIComponent(inicio) + '&select=id', {
      headers: { apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON, Prefer: 'count=exact' }
    }).then(function(r){ return r.json(); }).then(function(rows){
      document.getElementById('statAprobadasHoy').textContent = Array.isArray(rows) ? rows.length : 0;
    }).catch(function(){});
  }

  function cargar(){
    fetch(SUPA_URL + '/rest/v1/bitrix_eventos?estado_auditoria=eq.pendiente&order=creado_en.desc&limit=200', {
      headers: { apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON }
    }).then(function(r){ return r.json(); }).then(function(rows){
      rows = Array.isArray(rows) ? rows : [];
      render(rows);

      // Las filas que llegan crudas del webhook de Bitrix (sin titulo) se
      // enriquecen aqui mismo, desde el navegador, y luego se refresca la vista.
      var pendientesDeEnriquecer = rows.filter(function(r){ return !r.titulo && r.deal_id && /^\d+$/.test(String(r.deal_id)); });
      if(pendientesDeEnriquecer.length){
        Promise.all(pendientesDeEnriquecer.map(enrichRow)).then(function(){
          fetch(SUPA_URL + '/rest/v1/bitrix_eventos?estado_auditoria=eq.pendiente&order=creado_en.desc&limit=200', {
            headers: { apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON }
          }).then(function(r){ return r.json(); }).then(function(rows2){
            render(Array.isArray(rows2) ? rows2 : []);
          }).catch(function(){});
        });
      }
    }).catch(function(e){
      console.error('error cargando auditoria', e);
    });
  }

  function wireTabs(){
    document.querySelectorAll('.tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
        document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById(tab.getAttribute('data-target')).classList.add('active');
      });
    });
  }

  function initApp(){
    try{
      var savedName = sessionStorage.getItem('cer_auditor_nombre');
      if(savedName) document.getElementById('auditorName').value = savedName;
    }catch(e){}
    wireTabs();
    document.getElementById('btnRefresh').addEventListener('click', function(){ cargar(); cargarAprobadasHoy(); });
    cargar();
    cargarAprobadasHoy();
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function(){ cargar(); cargarAprobadasHoy(); }, 20000);
    if(clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(updateClock, 1000);
  }
})();
</script>
</body>
</html>
