name: Actualizar dashboards CAJAMAG

on:
  workflow_dispatch: {}
  schedule:
    # 29-sep-2026: 3 corridas al dia (hora Colombia = UTC-5): ~6:07 am, ~11:07 am
    # y ~4:07 pm. Minuto 7 (no :00) porque GitHub retrasa mucho los cron en punto
    # (la corrida de las 5 am llegaba a ejecutarse a la 1 pm).
    - cron: '7 11,16,21 * * *'

permissions:
  contents: write

concurrency:
  group: cajamag-dashboards-update
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      BITRIX_REST_URL: ${{ secrets.BITRIX_REST_URL }}
      PIPELINE_BASE_DIR: ${{ github.workspace }}
      PIPELINE_OUT_DIR: ${{ github.workspace }}
      BITRIX_EXPORT_DIR: ${{ github.workspace }}/_bitrix_export/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r _automation/requirements.txt

      # Regla vigente (7-oct-2026, aclarada por Luis): en CADA corrida se actualizan
      # los DOS meses -- primero el mes anterior completo (en Bitrix siguen
      # apareciendo, cambiando o desapareciendo ventas de ese mes) y luego el mes
      # real en curso, desde el dia 1. Lo unico que cambia del dia 1 al 3 es que mes
      # muestran POR DEFECTO el tablero y los dashboards (el anterior); eso lo decide
      # pipeline_master.py (mes_por_defecto). Si la pasada del mes anterior falla,
      # no bloquea la del mes en curso. Fechas en hora Colombia (UTC-5).
      - name: 0) Refrescar el mes anterior (cambios hechos en Bitrix despues del cierre)
        run: |
          PREV=$(python -c "from datetime import datetime,timezone,timedelta; t=datetime.now(timezone(timedelta(hours=-5))).date(); print((t.replace(day=1)-timedelta(days=1)).isoformat())")
          echo "Refrescando el mes anterior con corte $PREV"
          if FORCE_TODAY=$PREV python _automation/fetch_bitrix_data.py && FORCE_TODAY=$PREV python _automation/pipeline_master.py; then
            cp _automation/diag/CUADRE_VENTAS.md _automation/diag/CUADRE_VENTAS_mes_anterior.md || true
          else
            echo "::warning::No se pudo refrescar el mes anterior; se continua con el mes en curso"
            git checkout -- _automation/Dashboard_Master_DATA.html _automation/TV_Master_DATA.html
          fi

      - name: 1) Traer datos frescos de Bitrix (ventas + gestiones, mes en curso)
        run: python _automation/fetch_bitrix_data.py

      - name: 2) Pipeline maestro (merge + agregados + metas + dedup)
        run: python _automation/pipeline_master.py

      - name: 3) Corregir estado de congelamiento de empresas
        run: python _automation/actualizar_estado_empresas.py

      - name: 4) Recalcular agregados de empresas del Tablero TV
        run: python _automation/recompute_tv_empresas.py

      - name: 5) Reconstruir Dashboard Operativo
        run: python _automation/build_operativo.py

      - name: 6) Reconstruir Dashboard Gerencial
        run: python _automation/build_gerencial.py

      - name: 7) Reconstruir Tablero TV
        run: python _automation/build_tv.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "cajamag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dashboard_Operativo_CER.html Dashboard_Gerencial_CER.html Tablero_TV_Asesores_CER.html _automation/Dashboard_Master_DATA.html _automation/TV_Master_DATA.html _automation/diag/
          if git diff --cached --quiet; then
            echo "Sin cambios (datos ya estaban al dia)."
          else
            git commit -m "Actualizacion automatica de datos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Si alguien subio cambios mientras corria, integrarlos en vez de fallar.
            git pull --rebase -X theirs origin main || true
            git push
          fi
